<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Stickman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: transparent;
            overflow: hidden;
            position: relative;
        }

        .ground {
            display: none;
        }

        .walk-container {
            position: absolute;
            bottom: 0;
            left: 0;
            animation: walk 15s linear infinite;
        }

        @keyframes walk {
            0% {
                transform: translateX(-100px);
            }
            100% {
                transform: translateX(calc(100vw + 100px));
            }
        }

        .stickman {
            position: relative;
            width: 60px;
            height: 100px;
        }

        /* Head */
        .head {
            position: absolute;
            top: 0;
            left: 15px;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-radius: 50%;
            background: transparent;
        }

        /* Eyes */
        .head::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 5px;
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
            box-shadow: 12px 0 0 #333;
        }

        /* Smile */
        .head::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 15px;
            height: 8px;
            border: 2px solid #333;
            border-top: none;
            border-radius: 0 0 15px 15px;
            background: transparent;
        }

        /* Body */
        .body {
            position: absolute;
            top: 30px;
            left: 28px;
            width: 3px;
            height: 35px;
            background: #333;
        }

        /* Arms */
        .arm {
            position: absolute;
            top: 35px;
            width: 25px;
            height: 3px;
            background: #333;
            transform-origin: 0 50%;
            animation: armSwing 0.5s ease-in-out infinite alternate;
        }

        .arm.left {
            left: 28px;
            transform: rotate(-30deg);
        }

        .arm.right {
            left: 28px;
            transform: rotate(30deg);
            animation-delay: 0.25s;
        }

        @keyframes armSwing {
            0% {
                transform: rotate(-30deg);
            }
            100% {
                transform: rotate(30deg);
            }
        }

        /* Legs */
        .leg {
            position: absolute;
            top: 63px;
            width: 3px;
            height: 35px;
            background: #333;
            transform-origin: top center;
        }

        .leg.left {
            left: 28px;
            animation: legSwing 0.5s ease-in-out infinite alternate;
        }

        .leg.right {
            left: 28px;
            animation: legSwing 0.5s ease-in-out infinite alternate-reverse;
            animation-delay: 0.25s;
        }

        @keyframes legSwing {
            0% {
                transform: rotate(-25deg);
            }
            100% {
                transform: rotate(25deg);
            }
        }

        /* Dust particles */
        .dust {
            position: absolute;
            bottom: -5px;
            left: 10px;
            width: 6px;
            height: 6px;
            background: rgba(139, 119, 101, 0.6);
            border-radius: 50%;
            animation: dustMove 0.5s ease-out infinite;
        }

        .dust:nth-child(2) {
            left: 15px;
            animation-delay: 0.1s;
            width: 4px;
            height: 4px;
        }

        .dust:nth-child(3) {
            left: 5px;
            animation-delay: 0.2s;
            width: 5px;
            height: 5px;
        }

        @keyframes dustMove {
            0% {
                opacity: 0.8;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-20px, -10px) scale(0.3);
            }
        }
    </style>
</head>
<body>
    <!-- Walking Stickman -->
    <div class="walk-container">
        <div class="stickman">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
        <div class="dust"></div>
        <div class="dust"></div>
        <div class="dust"></div>
        </div>
    </div>
</body>
</html>
