{% extends "base.html" %} {% block title %}Create Post{% endblock %} {% block
content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="text-center mb-4">
        {% if session.get('lang') == 'de' %}Neuen Beitrag erstellen{% else
        %}Create New Post{% endif %}
      </h2>
      <div class="card p-4 shadow">
        <form action="/create_post" method="post" enctype="multipart/form-data">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <div class="mb-3">
            <label for="title" class="form-label"
              >{% if session.get('lang') == 'de' %}Titel{% else %}Title{% endif
              %}</label
            >
            <input
              type="text"
              class="form-control"
              id="title"
              name="title"
              required
            />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label"
              >{% if session.get('lang') == 'de' %}Beschreibung{% else
              %}Description{% endif %}</label
            >
            <textarea
              class="form-control"
              id="description"
              name="description"
              rows="3"
              required
            ></textarea>
          </div>
          <div class="mb-3">
            <label for="type" class="form-label"
              >{% if session.get('lang') == 'de' %}Typ{% else %}Type{% endif
              %}</label
            >
            <select class="form-control" id="type" name="type" required>
              <option value="sell">
                {% if session.get('lang') == 'de' %}Verkaufen{% else %}Sell{%
                endif %}
              </option>
              <option value="buy">
                {% if session.get('lang') == 'de' %}Kaufen{% else %}Buy{% endif
                %}
              </option>
              <option value="trade">
                {% if session.get('lang') == 'de' %}Tauschen{% else %}Trade{%
                endif %}
              </option>
              <option value="notification">
                {% if session.get('lang') == 'de' %}Benachrichtigung{% else
                %}Notification{% endif %}
              </option>
              <option value="giveaway">
                {% if session.get('lang') == 'de' %}Verschenken{% else %}Give Away{% endif %}
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label for="image" class="form-label"
              >{% if session.get('lang') == 'de' %}Bild{% else %}Image{% endif
              %}</label
            >
            <input
              type="file"
              class="form-control"
              id="image"
              name="image"
              accept="image/*"
            />
          </div>
          <div class="mb-3">
            <label for="price" class="form-label"
              >{% if session.get('lang') == 'de' %}Preis (optional){% else
              %}Price (optional){% endif %}</label
            >
            <input
              type="number"
              step="0.01"
              class="form-control"
              id="price"
              name="price"
              placeholder="Enter price"
            />
          </div>
          <div class="mb-3">
            <label for="links" class="form-label"
              >{% if session.get('lang') == 'de' %}Links{% else %}Links{% endif
              %}</label
            >
            <input type="url" class="form-control" id="links" name="links" />
          </div>
          <button type="submit" class="btn btn-primary w-100">
            {% if session.get('lang') == 'de' %}Posten{% else %}Post{% endif %}
          </button>
        </form>
      </div>
      <div class="text-center mt-3">
        <a href="/dashboard"
          >{% if session.get('lang') == 'de' %}Zurück zum Dashboard{% else
          %}Back to Dashboard{% endif %}</a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
